<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            justify-content: center;
            background-color: dimgray;
        }


        form {
            width: 450px;
            height: 450px;
            border: 1px solid black;
            margin: auto;
        }
        
    </style>
</head>
<body>
    <h1>Meu  primeiro Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off"> <!-- O action funciona para localizar a pasta para onde vai os dados --> <!-- o autocomplete off é para não ter sugestão de dados ao digitar -->
            <p><label for="inome">Nome</label> 
                <input type="text" name="nome" id="inome" required></p>
        <p><label for="isobrenome">Sobrenome</label> 
            <input type="text" name="sobrenome" id="isobrenome" required></p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
